general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    # Deeper blur for a better frosted glass effect
    blur_passes = 3 
    blur_size = 8
    # Darkened slightly to ensure white text is always readable
    brightness = 0.5 
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 90
    font_family = JetBrains Mono Nerd Font ExtraBold
    color = rgba(255, 255, 255, 1.0)
    
    # Adding a subtle shadow
    shadow_passes = 2
    shadow_size = 4
    
    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    color = rgba(255, 255, 255, 0.8)

    position = 0, 60
    halign = center
    valign = center
}

# GREETING
label {
    monitor =
    text = Welcome back, vortex.
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    color = rgba(255, 255, 255, 0.5)
    
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Transparent outer edge, semi-transparent dark inner
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(200, 200, 200)
    
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    
    # Softer rounded edges
    rounding = 12 
    
    # Visual feedback colors
    check_color = rgb(137, 180, 250) 
    fail_color = rgb(243, 139, 168)

    position = 0, -100
    halign = center
    valign = center
}
