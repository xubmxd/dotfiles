animations {
    enabled = true

    # --------------------------------------------------------
    # Bezier Curves
    # --------------------------------------------------------
    # Smooth ease-out
    bezier = smooth, 0.22, 1.0, 0.36, 1.0

    # Slight overshoot
    bezier = overshot, 0.34, 1.56, 0.64, 1.0

    # Nearly linear
    bezier = ease, 0.25, 0.1, 0.25, 1.0

    # --------------------------------------------------------
    # Windows
    # --------------------------------------------------------
    animation = windows, 1, 5, overshot, popin 88%
    animation = windowsOut, 1, 4, smooth, popin 88%
    animation = windowsMove, 1, 5, smooth
    animation = border, 1, 5, smooth
    animation = borderangle, 1, 8, ease

    # --------------------------------------------------------
    # Layers (Waybar, Rofi, Notifications)
    # --------------------------------------------------------
    animation = layers, 1, 4, smooth, slide
    animation = layersOut, 1, 4, smooth, slide
    animation = fade, 1, 4, smooth

    # --------------------------------------------------------
    # Workspaces
    # --------------------------------------------------------
    animation = workspaces, 1, 5, smooth, slide
    animation = specialWorkspace, 1, 5, smooth, slidevert
}
