
general {
    gaps_in = 1
    gaps_out = 1

    border_size = 3
    col.active_border = $color5 $color12 45deg
    col.inactive_border = $color0

    resize_on_border = false

    allow_tearing = true

    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
    enabled = true
    size = 3
    passes = 4
    new_optimizations = true
    }
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}
