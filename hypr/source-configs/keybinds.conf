$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, RETURN, exec, $terminal
bind = CTRL SHIFT, RETURN, exec, env -u QT_STYLE_OVERRIDE -u QT_QPA_PLATFORMTHEME QT_QPA_PLATFORM=xcb cool-retro-term
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, space , exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, U, layoutmsg, togglesplit # dwindle
bind = $mainMod, , layoutmsg, togglesplit # dwindle
bind = CTRL SHIFT, W, exec, ~/.local/bin/exec-waybar


# scripts_keybindings

# wallpaper - scripts

bind = $mainMod SHIFT, apostrophe, exec, ~/.config/hypr/scripts/wallpaper-selector.sh
bind = $mainMod, apostrophe, exec, ~/.config/hypr/scripts/random-wallpaper.sh
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/regenerate-colors.sh

# Emoji
bind = $mainMod, Period, exec, ~/.config/hypr/scripts/emoji-picker

# Spotify - scripts 
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/mewsic-toggle.sh

# Kernel bugs - temp fix
bind = $mainMod SHIFT, R, exec, sudo /usr/local/bin/fix-mouse

# wayclick
bind = $mainMod, F9, exec, ~/.scripts/wayclick/wayclick.sh

# screenshot_keybindings

# Fullscreen screenshot
bind = , Print, exec, grim ~/Pictures/Screenshots/screenshot_$(date +%s).png

# Area screenshot
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot_$(date +%s).png

# Clipboard screenshot
bind = $mainMod, Print, exec, grim - | wl-copy

bind = CTRL SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy 

# Screenshot with swappy (edit)
bind = ALT, Print, exec, grim -g "$(slurp)" - | swappy -f -



# Move focus with mainMod
bind = $mainMod, j, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, i, movefocus, u
bind = $mainMod, k, movefocus, d

# window movement
bind = $mainMod SHIFT, j, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, i, movewindow, u
bind = $mainMod SHIFT, k, movewindow, d

# window resize
bind = CTRL SHIFT, j, resizeactive, -20 0
bind = CTRL SHIFT, l, resizeactive, 20 0
bind = CTRL SHIFT, i, resizeactive, 0 -20
bind = CTRL SHIFT, k, resizeactive, 0 20 

# ==========================================
# ====== FUNCTION / MEDIA KEYS =============
# ==========================================

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Brightness control
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# media Control
gesture = 3, up, dispatcher, exec, playerctl play-pause
gesture = 3, left, dispatcher, exec, playerctl previous
gesture = 3, right, dispatcher, exec, playerctl next

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
