# ~/.config/foot/foot.ini

# ===== PYWAL COLORS =====
# Include must be at the absolute top/main section
include=~/.cache/wal/colors-foot.ini

# ===== MAIN APPEARANCE & FONT =====
font=Terminess Nerd Font:size=18
pad=10x10

# ===== SCROLLBACK =====
[scrollback]
lines=10000

# ===== CURSOR =====
[cursor]
style=block
blink=no

# ===== PERFORMANCE & BELL =====
[bell]
urgent=no
notify=no

# ===== OPACITY =====
[colors-dark]
alpha=0.7
blur=yes

